[package]
name = "sweep-scan"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rayon = "1.11"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
zstd = { version = "0.13", features = ["zstdmt"] }
