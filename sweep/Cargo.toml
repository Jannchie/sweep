[package]
name = "sweep"
version = "0.1.0"
edition = "2024"

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
memmap2 = "0.9"
raw-window-handle = "0.6"
sweep-scan = { path = "../sweep-scan" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
